# Child flow: tapping a button on the main screen plays it (a button without a recording must not crash).
# iOS by default; Android: maestro test -e APP_ID=com.IssieSays ...
appId: ${APP_ID || "org.issieshapiro.issiesays"}
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "main-button-0"
    timeout: 15000
- tapOn:
    id: "main-button-0"
- waitForAnimationToEnd
- assertVisible:
    id: "main-button-0"
# settings must not open on a plain tap (parent lock). Debug builds skip the lock (__DEV__), so this is
# checked on a Release build only: maestro test -e RELEASE=true ...
- runFlow:
    when:
      true: ${RELEASE == 'true'}
    commands:
      - tapOn:
          id: "settings-btn"
      - assertNotVisible:
          id: "buttons-plus"
