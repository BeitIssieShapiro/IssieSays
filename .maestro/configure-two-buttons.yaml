# Parent flow: open settings (press-and-hold), add a second button, name it, save, back to the main screen.
# iOS by default; Android: maestro test -e APP_ID=com.IssieSays ...
appId: ${APP_ID || "org.issieshapiro.issiesays"}
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "settings-btn"
    timeout: 15000
- longPressOn:
    id: "settings-btn"
- extendedWaitUntil:
    visible:
      id: "buttons-plus"
    timeout: 6000
# (Android can lose the first tap: tapped until the second button shows)
- repeat:
    times: 3
    while:
      notVisible:
        id: "edit-button-1"
    commands:
      - tapOn:
          id: "buttons-plus"
      - waitForAnimationToEnd:
          timeout: 2000
- tapOn:
    id: "edit-button-1"
- tapOn:
    id: "edit-button-name"
# (the field may hold a suggested name; Android drops letters typed before it has focus)
- waitForAnimationToEnd:
    timeout: 3000
- eraseText
- inputText: "Hello"
- tapOn:
    id: "edit-button-save"
- assertVisible: "Hello"
- tapOn:
    id: "screen-close-btn"
- assertVisible:
    id: "main-button-0"
- assertVisible:
    id: "main-button-1"
- takeScreenshot: says-two-buttons
